openapi: 3.1.0
info:
  title: OmniAlpha Data Facade
  version: 0.2.0
  description: |
    L0–L5 finance data product (phase-1).
    Markets are query params / symbol prefixes (CN:, US:, CRYPTO:, POLY:), never path segments.
servers:
  - url: http://localhost:8700
paths:
  /healthz:
    get:
      summary: Liveness
      responses:
        "200":
          description: OK
  /health/ready:
    get:
      summary: Readiness (Postgres + Redis)
      responses:
        "200":
          description: Ready
        "503":
          description: Dependency unavailable
  /v1/meta/capabilities:
    get:
      summary: Market × capability matrix
      responses:
        "200":
          description: Capabilities matrix (analyze/screen unsupported in phase-1)
  /v1/instruments:
    get:
      summary: List / filter instruments
      parameters:
        - name: market
          in: query
          schema: { type: string, enum: [CN, US, CRYPTO, POLY] }
        - name: q
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, default: 50 }
        - name: offset
          in: query
          schema: { type: integer, default: 0 }
      security:
        - ApiKeyAuth: []
      responses:
        "200":
          description: Instrument list
  /v1/instruments/search:
    get:
      summary: Search instruments by text
      parameters:
        - name: q
          in: query
          required: true
          schema: { type: string, minLength: 1 }
        - name: market
          in: query
          schema: { type: string, enum: [CN, US, CRYPTO, POLY] }
        - name: limit
          in: query
          schema: { type: integer, default: 20 }
      security:
        - ApiKeyAuth: []
      responses:
        "200":
          description: Instrument list
  /v1/quotes:
    get:
      summary: Get quotes
      parameters:
        - name: symbols
          in: query
          required: true
          schema: { type: string }
          description: "Comma-separated e.g. CN:600519,US:AAPL,CRYPTO:BTCUSDT,POLY:{id}"
      security:
        - ApiKeyAuth: []
      responses:
        "200":
          description: Quote list
  /v1/bars:
    get:
      summary: Get OHLCV bars
      parameters:
        - name: symbol
          in: query
          required: true
          schema: { type: string }
        - name: interval
          in: query
          schema: { type: string, default: 1d }
        - name: limit
          in: query
          schema: { type: integer, default: 5 }
      security:
        - ApiKeyAuth: []
      responses:
        "200":
          description: Bar list
  /v1/analyze:
    get:
      summary: Analytics (phase-1 stub)
      security:
        - ApiKeyAuth: []
      responses:
        "501":
          description: Not implemented in phase-1
  /v1/analytics/indicators:
    get:
      summary: Analytics indicators (phase-1 stub)
      security:
        - ApiKeyAuth: []
      responses:
        "501":
          description: Not implemented in phase-1
  /v1/screen:
    get:
      summary: Screener (phase-1 stub)
      security:
        - ApiKeyAuth: []
      responses:
        "501":
          description: Not implemented in phase-1
  /v1/screener/run:
    get:
      summary: Screener run (phase-1 stub)
      parameters:
        - name: market
          in: query
          schema: { type: string }
      security:
        - ApiKeyAuth: []
      responses:
        "501":
          description: Not implemented in phase-1
  /v1/prediction/events:
    get:
      summary: List prediction events (phase-1 stub)
      security:
        - ApiKeyAuth: []
      responses:
        "501":
          description: Not implemented in phase-1 (Prediction* schema not closed)
  /v1/prediction/markets:
    get:
      summary: List prediction markets (phase-1 stub)
      security:
        - ApiKeyAuth: []
      responses:
        "501":
          description: Not implemented in phase-1
  /v1/prediction/markets/{market_id}:
    get:
      summary: Get prediction market by id (phase-1 stub)
      parameters:
        - name: market_id
          in: path
          required: true
          schema: { type: string }
      security:
        - ApiKeyAuth: []
      responses:
        "501":
          description: Not implemented in phase-1
  /v1/prediction/quote:
    get:
      summary: Prediction market quote by id (phase-1 stub)
      parameters:
        - name: market_id
          in: query
          schema: { type: string }
      security:
        - ApiKeyAuth: []
      responses:
        "501":
          description: Not implemented in phase-1
components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
