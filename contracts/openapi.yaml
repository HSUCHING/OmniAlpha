openapi: 3.1.0
info:
  title: OmniAlpha Data Facade
  version: 0.2.0
  description: |
    L0–L5 finance data product (phase-1).
    Markets are query params / symbol prefixes (CN:, US:, CRYPTO:, POLY:), never path segments.
    Authenticated /v1 routes require header `X-API-Key` (default `dev-key`).
    Scalar UI (local): http://127.0.0.1:8701 — 公网勿裸奔.
servers:
  - url: https://api.metacognix.xyz
    description: Public facade
  - url: http://127.0.0.1:8700
    description: Local facade (host network)
  - url: http://localhost:8700
    description: Local facade alias
paths:
  /healthz:
    get:
      summary: Liveness
      responses:
        "200":
          description: OK
  /health/ready:
    get:
      summary: Readiness (Postgres + Redis)
      responses:
        "200":
          description: Ready
        "503":
          description: Dependency unavailable
  /v1/meta/capabilities:
    get:
      summary: Market × capability matrix
      responses:
        "200":
          description: Capabilities matrix (analyze/screen unsupported in phase-1)
  /v1/instruments:
    get:
      summary: List / filter instruments
      parameters:
        - name: market
          in: query
          schema: { type: string, enum: [CN, US, CRYPTO, POLY] }
        - name: q
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, default: 50 }
        - name: offset
          in: query
          schema: { type: integer, default: 0 }
      security:
        - ApiKeyAuth: []
      responses:
        "200":
          description: Instrument list
  /v1/instruments/search:
    get:
      summary: Search instruments by text
      parameters:
        - name: q
          in: query
          required: true
          schema: { type: string, minLength: 1 }
        - name: market
          in: query
          schema: { type: string, enum: [CN, US, CRYPTO, POLY] }
        - name: limit
          in: query
          schema: { type: integer, default: 20 }
      security:
        - ApiKeyAuth: []
      responses:
        "200":
          description: Instrument list
  /v1/quotes:
    get:
      summary: Get quotes
      parameters:
        - name: symbols
          in: query
          required: true
          schema: { type: string }
          description: "Comma-separated e.g. CN:600519,US:AAPL,CRYPTO:BTCUSDT,POLY:{id}"
      security:
        - ApiKeyAuth: []
      responses:
        "200":
          description: Quote list
  /v1/bars:
    get:
      summary: Get OHLCV bars
      parameters:
        - name: symbol
          in: query
          required: true
          schema: { type: string }
        - name: interval
          in: query
          schema: { type: string, default: 1d }
        - name: limit
          in: query
          schema: { type: integer, default: 5 }
      security:
        - ApiKeyAuth: []
      responses:
        "200":
          description: Bar list
  /v1/analyze:
    get:
      summary: Analytics (phase-1 stub)
      security:
        - ApiKeyAuth: []
      responses:
        "501":
          description: Not implemented in phase-1
  /v1/analytics/indicators:
    get:
      summary: Analytics indicators (phase-1 stub)
      security:
        - ApiKeyAuth: []
      responses:
        "501":
          description: Not implemented in phase-1
  /v1/screen:
    get:
      summary: Screener (phase-1 stub)
      security:
        - ApiKeyAuth: []
      responses:
        "501":
          description: Not implemented in phase-1
  /v1/screener/run:
    get:
      summary: Screener run (phase-1 stub)
      parameters:
        - name: market
          in: query
          schema: { type: string }
      security:
        - ApiKeyAuth: []
      responses:
        "501":
          description: Not implemented in phase-1
  /v1/prediction/events:
    get:
      summary: List prediction events (alias of markets)
      description: Thin alias of /v1/prediction/markets for Polymarket (POLY). Not equity Quote/Bar.
      parameters:
        - name: limit
          in: query
          schema: { type: integer, default: 10, minimum: 1, maximum: 100 }
        - name: q
          in: query
          schema: { type: string }
          description: Filter by question/id substring
        - name: active
          in: query
          schema: { type: boolean, default: true }
      security:
        - ApiKeyAuth: []
      responses:
        "200":
          description: PredictionMarketList
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PredictionMarketList"
        "401":
          description: Missing or invalid API key
  /v1/prediction/markets:
    get:
      summary: List prediction markets (Polymarket Gamma)
      description: |
        POLY prediction markets via Gamma. Separate from equity /v1/quotes and /v1/bars.
      parameters:
        - name: limit
          in: query
          schema: { type: integer, default: 20, minimum: 1, maximum: 100 }
        - name: q
          in: query
          schema: { type: string }
          description: Filter by question/id substring
      security:
        - ApiKeyAuth: []
      responses:
        "200":
          description: PredictionMarketList
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PredictionMarketList"
        "401":
          description: Missing or invalid API key
  /v1/prediction/markets/{market_id}:
    get:
      summary: Get prediction market by id
      parameters:
        - name: market_id
          in: path
          required: true
          schema: { type: string }
          description: Polymarket market id or POLY:{id}
      security:
        - ApiKeyAuth: []
      responses:
        "200":
          description: PredictionMarket
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PredictionMarket"
        "404":
          description: Market not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "422":
          description: Empty or invalid market_id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /v1/prediction/quote:
    get:
      summary: Prediction market probability quote
      description: |
        Returns PredictionQuote (outcomes / yes_price / no_price).
        Do NOT use equity /v1/quotes for POLY.
      parameters:
        - name: market_id
          in: query
          required: true
          schema: { type: string }
          description: Polymarket market id or POLY:{id}
      security:
        - ApiKeyAuth: []
      responses:
        "200":
          description: PredictionQuote
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PredictionQuote"
        "404":
          description: Market not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "422":
          description: Empty or invalid market_id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key

  schemas:
    ApiError:
      type: object
      description: |
        Unified error body. code enum is LOCKED to exactly five values
        (not_found|unsupported|stale|invalid_id|rate_limited).
        Do NOT add validation_error / unauthorized / not_implemented / etc.
        Phase1 dual-track: 401 and generic 422 may still return FastAPI `{detail}` only;
        404/501 and ID-shaped 422 use ApiError with the five codes.
      required: [code, message]
      properties:
        code:
          type: string
          enum: [not_found, unsupported, stale, invalid_id, rate_limited]
        message:
          type: string
        market:
          type: string
          enum: [CN, US, CRYPTO, POLY]
        capability:
          type: string

    PredictionOutcome:
      type: object
      required: [name, price]
      properties:
        name: { type: string }
        price:
          type: number
          minimum: 0
          maximum: 1
          description: Implied probability in [0, 1]
    PredictionMarket:
      type: object
      required: [id, symbol, as_of, source]
      properties:
        id: { type: string }
        symbol: { type: string, description: "POLY:{id}" }
        question: { type: string, nullable: true }
        slug: { type: string, nullable: true }
        active: { type: boolean, nullable: true }
        closed: { type: boolean, nullable: true }
        outcomes:
          type: array
          items:
            $ref: "#/components/schemas/PredictionOutcome"
        volume: { type: number, nullable: true }
        liquidity: { type: number, nullable: true }
        end_date: { type: string, nullable: true }
        as_of: { type: string }
        source: { type: string }
        stale: { type: boolean, default: false }
    PredictionMarketList:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/PredictionMarket"
        total: { type: integer }
        warnings:
          type: array
          items: { type: string }
    PredictionQuote:
      type: object
      required: [market_id, symbol, as_of, source]
      properties:
        market_id: { type: string }
        symbol: { type: string }
        question: { type: string, nullable: true }
        outcomes:
          type: array
          items:
            $ref: "#/components/schemas/PredictionOutcome"
        yes_price: { type: number, nullable: true, minimum: 0, maximum: 1 }
        no_price: { type: number, nullable: true, minimum: 0, maximum: 1 }
        as_of: { type: string }
        source: { type: string }
        stale: { type: boolean, default: false }

