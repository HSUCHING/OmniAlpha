# MCP tools mirror of /v1 (phase-1). Keep param names lockstep with OpenAPI + apps/facade/mcp_tools.py.
# Prediction tools return Prediction* objects; POLY is NOT available via equity Quote/Bar.
version: "0.2.0"
server: data-facade
transport: http
mount: /mcp
tools:
  - name: search_instruments
    phase: 1
    status: implemented
    http: { method: GET, path: /v1/instruments/search }
    params:
      - { name: q, type: string, required: true }
      - { name: market, type: string, required: false, enum: [CN, US, CRYPTO, POLY] }
      - { name: limit, type: integer, required: false, default: 20 }
    returns: InstrumentList

  - name: get_quotes
    phase: 1
    status: implemented
    http: { method: GET, path: /v1/quotes }
    params:
      - { name: symbols, type: string, required: true, description: "Comma-separated PREFIX:CODE" }
    returns: QuoteList
    notes: "POLY equity quotes unsupported; use search_prediction_markets / get_prediction_quote."

  - name: get_bars
    phase: 1
    status: implemented
    http: { method: GET, path: /v1/bars }
    params:
      - { name: symbol, type: string, required: true }
      - { name: interval, type: string, required: false, default: 1d }
      - { name: limit, type: integer, required: false, default: 5 }
    returns: BarList

  - name: get_capabilities
    phase: 1
    status: implemented
    http: { method: GET, path: /v1/meta/capabilities }
    params: []
    returns: CapabilitiesResponse
    notes: "Single source of truth: domain/meta. POLY.prediction=implemented (polymarket-gamma)."

  - name: search_prediction_markets
    phase: 1
    status: implemented
    http: { method: GET, path: /v1/prediction/markets }
    params:
      - { name: q, type: string, required: false }
      - { name: limit, type: integer, required: false, default: 20 }
    returns: PredictionMarketList
    notes: "Polymarket Gamma; not equity InstrumentList."

  - name: get_prediction_market
    phase: 1
    status: implemented
    http: { method: GET, path: /v1/prediction/markets/{market_id} }
    params:
      - { name: market_id, type: string, required: true, description: "id or POLY:{id}" }
    returns: PredictionMarket

  - name: get_prediction_quote
    phase: 1
    status: implemented
    http: { method: GET, path: /v1/prediction/quote }
    params:
      - { name: market_id, type: string, required: true }
    returns: PredictionQuote
    notes: "Probabilities in [0,1]; do not use get_quotes for POLY."
