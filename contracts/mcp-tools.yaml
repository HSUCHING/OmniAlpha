# MCP tools mirror of /v1 (phase-1). Keep param names lockstep with OpenAPI + apps/facade/mcp_tools.py.
# 实装工具 vs 未实现（soft）需与 capabilities / HTTP 状态对齐。
version: "0.2.0"
server: data-facade
transport: http
mount: /mcp
tools:
  - name: search_instruments
    phase: 1
    status: implemented
    http: { method: GET, path: /v1/instruments/search }
    params:
      - { name: q, type: string, required: true }
      - { name: market, type: string, required: false, enum: [CN, US, CRYPTO, POLY] }
      - { name: limit, type: integer, required: false, default: 20 }
    returns: InstrumentList

  - name: get_quotes
    phase: 1
    status: implemented
    http: { method: GET, path: /v1/quotes }
    params:
      - { name: symbols, type: string, required: true, description: "Comma-separated PREFIX:CODE" }
    returns: QuoteList
    notes: "POLY equity quotes unsupported in phase-1; use prediction path when closed."

  - name: get_bars
    phase: 1
    status: implemented
    http: { method: GET, path: /v1/bars }
    params:
      - { name: symbol, type: string, required: true }
      - { name: interval, type: string, required: false, default: 1d }
      - { name: limit, type: integer, required: false, default: 5 }
    returns: BarList

  - name: get_capabilities
    phase: 1
    status: implemented
    http: { method: GET, path: /v1/meta/capabilities }
    params: []
    returns: CapabilitiesResponse
    notes: "Single source of truth: domain/meta."

  - name: list_prediction_events
    phase: 1
    status: unsupported
    http: { method: GET, path: /v1/prediction/events, status: 501 }
    params:
      - { name: limit, type: integer, required: false, default: 10 }
      - { name: active, type: boolean, required: false, default: true }
    returns: soft_dict
    notes: "F3 backlog: MCP soft dict ≠ HTTP 501; do not advertise implemented."

  - name: get_prediction_quote
    phase: 1
    status: unsupported
    http: { method: GET, path: /v1/prediction/quote, status: 501 }
    params:
      - { name: market_id, type: string, required: true }
    returns: soft_dict
    notes: "F3 backlog; Prediction* Pydantic pending product launch."
