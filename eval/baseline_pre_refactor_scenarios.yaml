# Machine-readable scenario matrix.
# Markets: CN / US / CRYPTO / POLY
# Capabilities: watch / query / screen / analyze
# Verdict rules (Eval.md): 未实现 → SKIP/N/A-phase1，不得判 FAIL；宣称实现则必过。
version: 2
phase_current: 1
base_local: http://127.0.0.1:8700
base_public: https://api.metacognix.xyz
auth_header: X-API-Key

# Representative symbols per market (seed / smoke)
symbols:
  CN: CN:600519
  US: US:AAPL
  CRYPTO: CRYPTO:BTCUSDT
  POLY: POLY:DUMMY  # no seed in phase-1

# ─── Matrix cells: market × capability ───────────────────────────────────────
matrix:
  - id: M-CN-watch
    market: CN
    capability: watch
    phase: 1
    invoke: [http, mcp]
    http: { method: GET, path: /v1/quotes, query: { symbols: "CN:600519" } }
    mcp: { tool: get_quotes, args: { symbols: "CN:600519" } }
    expect:
      http_status: 200
      min_items: 1
      fields: [symbol, last, as_of, source, stale]
      http_mcp_parity: true

  - id: M-CN-query
    market: CN
    capability: query
    phase: 1
    invoke: [http, mcp]
    http: { method: GET, path: /v1/instruments, query: { market: "CN", limit: "5" } }
    mcp: { tool: search_instruments, args: { q: "茅台", market: "CN", limit: 5 } }
    expect: { http_status: 200, min_items: 1 }

  - id: M-CN-query-bars
    market: CN
    capability: query
    phase: 1
    invoke: [http, mcp]
    http: { method: GET, path: /v1/bars, query: { symbol: "CN:600519", interval: "1d", limit: "5" } }
    mcp: { tool: get_bars, args: { symbol: "CN:600519", interval: "1d", limit: 5 } }
    expect: { http_status: 200, min_items: 1, http_mcp_parity: true }

  - id: M-CN-screen
    market: CN
    capability: screen
    phase: 1
    invoke: [http]
    http: { method: GET, path: /v1/screener/run, query: { market: "CN" } }
    expect: { http_status_in: [404, 501, 422], skip_if_unimplemented: true }
    note: N/A-phase1 screener stub

  - id: M-CN-analyze
    market: CN
    capability: analyze
    phase: 1
    invoke: [http]
    http: { method: GET, path: /v1/analytics/indicators, query: { symbol: "CN:600519" } }
    expect: { http_status_in: [404, 501, 422], skip_if_unimplemented: true }
    note: N/A-phase1 analytics stub

  - id: M-US-watch
    market: US
    capability: watch
    phase: 1
    invoke: [http, mcp]
    http: { method: GET, path: /v1/quotes, query: { symbols: "US:AAPL" } }
    mcp: { tool: get_quotes, args: { symbols: "US:AAPL" } }
    expect:
      http_status: 200
      skip_if_warning_contains: "not implemented"
      http_mcp_parity: true

  - id: M-US-query
    market: US
    capability: query
    phase: 1
    invoke: [http, mcp]
    http: { method: GET, path: /v1/instruments, query: { market: "US", limit: "5" } }
    mcp: { tool: search_instruments, args: { q: "Apple", market: "US", limit: 5 } }
    expect: { http_status: 200, min_items: 1 }

  - id: M-US-screen
    market: US
    capability: screen
    phase: 1
    invoke: [http]
    http: { method: GET, path: /v1/screener/run, query: { market: "US" } }
    expect: { http_status_in: [404, 501, 422], skip_if_unimplemented: true }

  - id: M-US-analyze
    market: US
    capability: analyze
    phase: 1
    invoke: [http]
    http: { method: GET, path: /v1/analytics/indicators, query: { symbol: "US:AAPL" } }
    expect: { http_status_in: [404, 501, 422], skip_if_unimplemented: true }

  - id: M-CRYPTO-watch
    market: CRYPTO
    capability: watch
    phase: 1
    invoke: [http, mcp]
    http: { method: GET, path: /v1/quotes, query: { symbols: "CRYPTO:BTCUSDT" } }
    mcp: { tool: get_quotes, args: { symbols: "CRYPTO:BTCUSDT" } }
    expect:
      http_status: 200
      skip_if_warning_contains: "not implemented"
      http_mcp_parity: true

  - id: M-CRYPTO-query
    market: CRYPTO
    capability: query
    phase: 1
    invoke: [http, mcp]
    http: { method: GET, path: /v1/instruments, query: { market: "CRYPTO", limit: "5" } }
    mcp: { tool: search_instruments, args: { q: "Bitcoin", market: "CRYPTO", limit: 5 } }
    expect: { http_status: 200, min_items: 1 }

  - id: M-CRYPTO-screen
    market: CRYPTO
    capability: screen
    phase: 1
    invoke: [http]
    http: { method: GET, path: /v1/screener/run, query: { market: "CRYPTO" } }
    expect: { http_status_in: [404, 501, 422], skip_if_unimplemented: true }

  - id: M-CRYPTO-analyze
    market: CRYPTO
    capability: analyze
    phase: 1
    invoke: [http]
    http: { method: GET, path: /v1/analytics/indicators, query: { symbol: "CRYPTO:BTCUSDT" } }
    expect: { http_status_in: [404, 501, 422], skip_if_unimplemented: true }

  - id: M-POLY-watch
    market: POLY
    capability: watch
    phase: 1
    invoke: [http, mcp]
    http: { method: GET, path: /v1/quotes, query: { symbols: "POLY:DUMMY" } }
    mcp: { tool: get_quotes, args: { symbols: "POLY:DUMMY" } }
    expect:
      http_status: 200
      skip_if_warning_contains: "not implemented"
      http_mcp_parity: true

  - id: M-POLY-query
    market: POLY
    capability: query
    phase: 1
    invoke: [http]
    soft: true
    http: { method: GET, path: /v1/instruments, query: { market: "POLY", limit: "5" } }
    expect:
      http_status: 200
      skip_if_empty: true

  - id: M-POLY-screen
    market: POLY
    capability: screen
    phase: 1
    invoke: [http]
    http: { method: GET, path: /v1/screener/run, query: { market: "POLY" } }
