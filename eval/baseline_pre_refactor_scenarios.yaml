    http: { method: GET, path: /v1/analytics/indicators, query: { symbol: "POLY:DUMMY" } }
    expect: { http_status_in: [404, 501, 422], skip_if_unimplemented: true }

# ─── Legacy phase1 gate scenarios (S1–S8) ────────────────────────────────────
scenarios:
  - id: S1
    name: search instruments
    capability: query
    market: CN
    invoke: [http, mcp]
    http: { method: GET, path: /v1/instruments, query: { q: "茅台" } }
    mcp: { tool: search_instruments, args: { q: "茅台" } }
    expect: { http_status: 200, min_items: 1 }
    phase: 1
  - id: S2
    name: get quote
    capability: watch
    market: CN
    invoke: [http, mcp]
    http: { method: GET, path: /v1/quotes, query: { symbols: "CN:600519" } }
    mcp: { tool: get_quotes, args: { symbols: "CN:600519" } }
    expect: { http_status: 200, fields: [symbol, last, as_of, source, stale], http_mcp_parity: true }
    phase: 1
  - id: S3
    name: get bars 1d
    capability: query
    market: CN
    invoke: [http, mcp]
    http: { method: GET, path: /v1/bars, query: { symbol: "CN:600519", interval: "1d", limit: "5" } }
    mcp: { tool: get_bars, args: { symbol: "CN:600519", interval: "1d", limit: 5 } }
    expect: { http_status: 200, min_items: 1, http_mcp_parity: true }
    phase: 1
  - id: S4
    name: multi-symbol quotes
    capability: watch
    market: CN
    invoke: [http, mcp]
    http: { method: GET, path: /v1/quotes, query: { symbols: "CN:600519,CN:000001" } }
    mcp: { tool: get_quotes, args: { symbols: "CN:600519,CN:000001" } }
    expect: { http_status: 200, min_items: 1 }
    phase: 1
  - id: S5
    name: cross-market seed
    capability: query
    market: US
    invoke: [http]
    http: { method: GET, path: /v1/instruments, query: { market: "US" } }
    expect: { http_status: 200 }
    phase: 1
    soft: true
  - id: S6
    name: invalid prefix
    capability: protocol
    invoke: [http]
    http: { method: GET, path: /v1/quotes, query: { symbols: "FOO:1" } }
    expect: { http_status: 422 }
    phase: 1
  - id: S7
    name: missing api key
    capability: auth
    invoke: [http]
    http: { method: GET, path: /v1/instruments, headers: {} }
    expect: { http_status: 401 }
    phase: 1
  - id: S8
    name: unimplemented analytics not 500
    capability: analyze
    invoke: [http]
    http: { method: GET, path: /v1/analytics/indicators }
    expect: { http_status_in: [404, 501, 422] }
    phase: 1
  - id: S9
    name: stale flag
    capability: watch
    phase: 2
  - id: S14
    name: mcp auth parity
    capability: auth
    phase: 2

# Ops probes (not matrix cells)
ops:
  - id: G2-local-healthz
    http: { method: GET, path: /healthz, auth: false }
    expect: { http_status: 200 }
  - id: G2b-public-healthz
    base: public
    soft: true
    http: { method: GET, path: /healthz, auth: false }
    expect: { http_status: 200 }
