name: deploy-tag-webhook

on:
  push:
    tags:
      - "deploy-*"

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Require secrets
        env:
          DEPLOY_WEBHOOK_SECRET: ${{ secrets.DEPLOY_WEBHOOK_SECRET }}
        run: |
          if [ -z "$DEPLOY_WEBHOOK_SECRET" ]; then
            echo "DEPLOY_WEBHOOK_SECRET is required" >&2
            exit 1
          fi

      - name: POST signed deploy hook
        env:
          DEPLOY_WEBHOOK_SECRET: ${{ secrets.DEPLOY_WEBHOOK_SECRET }}
          DEPLOY_WEBHOOK_URL: ${{ secrets.DEPLOY_WEBHOOK_URL }}
        run: |
          set -euo pipefail
          URL="${DEPLOY_WEBHOOK_URL:-https://deploy.metacognix.xyz/hooks/deploy}"
          TAG="${GITHUB_REF_NAME}"
          BODY=$(printf '{"tag":"%s","ref":"%s","sha":"%s","repository":"%s"}' \
            "$TAG" "$GITHUB_REF" "$GITHUB_SHA" "$GITHUB_REPOSITORY")
          SIG=$(printf '%s' "$BODY" | openssl dgst -sha256 -hmac "$DEPLOY_WEBHOOK_SECRET" | awk '{print $2}')
          curl -fsS -X POST "$URL" \
            -H "Content-Type: application/json" \
            -H "X-Deploy-Signature: sha256=${SIG}" \
            -d "$BODY"
